<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="async.css" />
</head>

<body>
    <div class="menu-bar">
        <button id="clear-items-btn">Удалить все карточки</button>
        <button id="load-items-btn">Получить все карточки</button>
    </div>

    <template id="card-mockup">
        <div class="user-card">
            <p class="user-name"></p>
            <p class="user-surname"></p>
            <p class="user-email"></p>
            <p class="user-age"></p>
            <p class="user-city"></p>
            <button class="remove-card-btn">Удалить</button>
        </div>
    </template>

    <div id="wrapper">
        <h1 class="info-label">Данные загружаются</h1>
    </div>
    <script src="async.js"></script>
</body>

</html>
